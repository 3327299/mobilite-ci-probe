name: Build MobiLite IPA v29.1

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
      - '_ci_logs/**'
      - '*.md'

permissions:
  contents: write

env:
  MC_VER: "1.21.4"
  AOT_SCOPE: "full"
  CLASS_VER: "52"
  ROBOVM_VERSION: "3.0.1"
  FILEBIN_BIN: "mobilite-v291"
  GRADLE_BIN: "/tmp/gradle-8.8/bin/gradle"
  SRC_ZIP: "https://aka.doubaocdn.com/s/C1Ts65Gv8l"
  FIXED_BVS: "https://aka.doubaocdn.com/s/B17DB7sA8q"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 解包源码 + 覆盖修复文件
        run: |
          set -x
          curl -fsSL --retry 5 --retry-all-errors --max-time 600 -o /tmp/src.zip "$SRC_ZIP"
          echo "zip bytes: $(wc -c < /tmp/src.zip)"
          rm -rf /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          ROOT=$(dirname "$(find /tmp/src -maxdepth 3 -type d -name Sources | head -1)")
          cp -R "$ROOT/." .

          echo "---- ObjC 修复 ----"
          sed -i '' 's/static id gLayer;/static CAEAGLLayer *gLayer;/' bridge/glfw-ios/GLFWIos.m
          sed -i '' '/^\+ \(void\)pushEventType:\(int32_t\)t a:\(int32_t\)a b:\(int32_t\)b x:\(double\)x y:\(double\)y;/d' bridge/glfw-ios/GLFWIos.m
          grep -q '<dlfcn.h>' bridge/glfw-ios/MobiEGL.m || sed -i '' 's|#include <string.h>|#include <string.h>\n#include <dlfcn.h>|' bridge/glfw-ios/MobiEGL.m

          echo "---- 覆盖 build-version.sh ----"
          curl -fsSL --retry 5 --max-time 120 -o /tmp/bvs.sh "$FIXED_BVS" && cp /tmp/bvs.sh pipeline/scripts/build-version.sh && chmod +x pipeline/scripts/build-version.sh
          grep -c "2a2/5" pipeline/scripts/build-version.sh
          grep -n "rc=\${SRC}" pipeline/scripts/build-version.sh
          bash -n pipeline/scripts/build-version.sh && echo "bash -n OK"

          echo "---- 内联 StripDebug.java（不依赖下载）----"
          mkdir -p .ci
          cat > .ci/StripDebug.java <<'JAVA'
import java.io.*;
import java.util.*;
import java.util.zip.*;
import org.objectweb.asm.*;

public final class StripDebug {
    public static void main(String[] args) throws Exception {
        File in = new File(args[0]);
        File out = new File(args[1]);
        int classes = 0;
        try (ZipFile zf = new ZipFile(in);
             ZipOutputStream zo = new ZipOutputStream(new FileOutputStream(out))) {
            Enumeration<? extends ZipEntry> en = zf.entries();
            while (en.hasMoreElements()) {
                ZipEntry e = en.nextElement();
                byte[] b;
                try (InputStream is = zf.getInputStream(e)) { b = is.readAllBytes(); }
                if (e.getName().endsWith(".class")) {
                    ClassReader cr = new ClassReader(b);
                    ClassWriter cw = new ClassWriter(cr, 0);
                    ClassVisitor cv = new ClassVisitor(Opcodes.ASM9, cw) {
                        @Override public void visitLocalVariable(String n, String d, String s, Label a, Label z, int i) {}
                    };
                    cr.accept(cv, 0);
                    b = cw.toByteArray();
                    classes++;
                }
                zo.putNextEntry(new ZipEntry(e.getName()));
                zo.write(b);
                zo.closeEntry();
            }
        }
        System.out.println("[strip] classes processed: " + classes);
        System.out.println("[strip] out: " + out + " (" + out.length() / 1024 / 1024 + " MB)");
    }
}
JAVA
          wc -l .ci/StripDebug.java

      - name: xcodegen
        run: |
          set -x
          curl -fsSL --retry 3 -o /tmp/xg.zip "https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip"
          rm -rf /tmp/xg && unzip -q /tmp/xg.zip -d /tmp/xg
          XG=$(find /tmp/xg -maxdepth 4 -type f -name xcodegen | head -1)
          chmod +x "$XG"
          export PATH="$(dirname "$XG"):$PATH"
          echo "$(dirname "$XG")" >> "$GITHUB_PATH"
          xcodegen generate
          ls -d MobiLite.xcodeproj

      - name: JDK21 + gradle8.8 + RoboVM 五件套 + ASM + 编译 StripDebug
        run: |
          set -x
          curl -fsSL --retry 5 --max-time 600 -o /tmp/jdk21.tgz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
          mkdir -p /tmp/jdk21 && tar xzf /tmp/jdk21.tgz -C /tmp/jdk21
          J21=$(find /tmp/jdk21 -maxdepth 4 -type d -name Home | head -1)
          export JAVA_HOME="$J21" PATH="$J21/bin:$PATH"
          java -version 2>&1 | head -2
          curl -fsSL --retry 5 --max-time 600 -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.8-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp && chmod +x /tmp/gradle-8.8/bin/gradle
          mkdir -p "$HOME/.tools"
          V="$ROBOVM_VERSION"
          for a in robovm-rt robovm-objc robovm-cocoatouch robovm-bro-bridge robovm-gradle-plugin; do
            curl -fsSL --retry 3 -o "$HOME/.tools/$a.jar" "https://repo1.maven.org/maven2/com/mobidevelop/robovm/$a/$V/$a-$V.jar" || echo "MISS $a"
          done
          curl -fsSL --retry 3 -o "$HOME/.tools/jvmdowngrader-all.jar" "https://repo1.maven.org/maven2/xyz/wagyourtail/jvmdowngrader/jvmdowngrader/2.0.1/jvmdowngrader-2.0.1-all.jar"
          curl -fsSL --retry 3 -o "$HOME/.tools/asm.jar" "https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7/asm-9.7.jar"
          mkdir -p "$HOME/.tools/stripdebug"
          "$J21/bin/javac" -cp "$HOME/.tools/asm.jar" -d "$HOME/.tools/stripdebug" .ci/StripDebug.java 2>&1 | tail -10
          ls -l "$HOME/.tools/stripdebug"
          "$J21/bin/java" -cp "$HOME/.tools/asm.jar:$HOME/.tools/stripdebug" StripDebug 2>&1 | head -3 || true
          {
            echo "JAVA_HOME=$J21"
            echo "JVD_JAR=$HOME/.tools/jvmdowngrader-all.jar"
            echo "JAVAC_BIN=$J21/bin/javac"
            echo "JAVA_BIN=$J21/bin/java"
            echo "DEVELOPER_DIR=$(xcode-select -p)"
          } >> "$GITHUB_ENV"

      - name: ObjC/Swift 冒烟
        run: |
          set +e
          xcodebuild -project MobiLite.xcodeproj -scheme MobiLite -configuration Debug -sdk iphoneos \
            -derivedDataPath build-smoke CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > /tmp/smoke.log 2>&1
          echo "smoke rc=$?"
          grep -cE " error: " /tmp/smoke.log
          grep -E " error: " /tmp/smoke.log | sed 's|.*/mobilite-ci-probe/||' | head -20

      - name: MobiVM AOT（真编版本二进制）
        run: |
          set +e
          export JVD_JAR="$HOME/.tools/jvmdowngrader-all.jar"
          python3 pipeline/scripts/fetch-vanilla.py "$MC_VER" "/tmp/mc$MC_VER"
          ./pipeline/api-jar/build.sh 2>&1 | tail -5
          export API_JAR="$PWD/pipeline/out/api-java21-down52.jar"
          mkdir -p "Frameworks/Versions/$MC_VER"
          cp "/tmp/mc$MC_VER/$MC_VER.json" "Frameworks/Versions/$MC_VER/version.json"
          AOT_SCOPE="$AOT_SCOPE" CLASS_VER="$CLASS_VER" ROBOVM_VERSION="$ROBOVM_VERSION" \
            ./pipeline/scripts/build-version.sh "$MC_VER" "/tmp/mc$MC_VER/client.jar" "/tmp/mc$MC_VER/libs" 2>&1 | tee /tmp/aot-all.log
          echo "AOT_RC=${PIPESTATUS[0]}" | tee -a /tmp/aot-all.log

      - name: 诊断
        if: always()
        run: |
          set +e
          echo "======== AOT 标记行 ========"
          grep -nE "==== [0-9]+[a-z]*/5|gradle 退出码|bundle 校验返回|strip ok|classes processed|下载 robovm|OK：|ERROR|AOT_RC" /tmp/aot-all.log | tail -30
          echo "======== gradle 错误 ========"
          grep -nE "What went wrong|Caused by|FAILED|OutOfMemory|GC overhead" pipeline/build/$MC_VER/gradle-aot.log 2>/dev/null | head -15
          echo "======== 版本目录 ========"
          find Frameworks/Versions -name GameRuntime 2>/dev/null | head -3
          file $(find Frameworks/Versions -name GameRuntime 2>/dev/null | head -1) 2>/dev/null
          python3 pipeline/scripts/verify_framework.py "Frameworks/Versions/$MC_VER" 2>/dev/null; echo "verify rc=$?"
          cat Frameworks/Versions/versions.json 2>/dev/null

      - name: XcodeGen + 出未签名 IPA
        if: always()
        run: |
          set +e
          xcodebuild -project MobiLite.xcodeproj -scheme MobiLite -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > /tmp/xcode2.log 2>&1
          echo "xcodebuild rc=$?"
          grep -cE " error: " /tmp/xcode2.log
          grep -E "valid version|未通过 verify|embedded versions" /tmp/xcode2.log | head -10
          APP="build/Build/Products/Release-iphoneos/MobiLite.app"
          if [ -f "$APP/MobiLite" ]; then
            rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
            zip -qry "MobiLite-$MC_VER-$AOT_SCOPE-v29.1-unsigned.ipa" Payload
            ls -l "MobiLite-$MC_VER-$AOT_SCOPE-v29.1-unsigned.ipa"
            du -sh "$APP"
            unzip -l "MobiLite-$MC_VER-$AOT_SCOPE-v29.1-unsigned.ipa" | grep -E "GameRuntime|versions.json"
          else
            echo "NO APP BUILT"
          fi

      - name: 上传 filebin
        if: always()
        run: |
          set +e
          BIN="$FILEBIN_BIN"
          {
            echo "aot=1 scope=$AOT_SCOPE robovm=$ROBOVM_VERSION"
            echo "ipa: $(ls -1 *.ipa 2>/dev/null)"
            echo "== versions.json"
            cat Frameworks/Versions/versions.json 2>/dev/null
            echo "== ipa listing"
            unzip -l *.ipa 2>/dev/null | grep -E "GameRuntime|versions.json|MobiLite$" | head -20
          } > manifest.txt 2>&1
          cat manifest.txt
          for f in $(ls -1 *.ipa 2>/dev/null) manifest.txt /tmp/aot-all.log /tmp/xcode2.log /tmp/smoke.log pipeline/build/1.21.4/gradle-aot.log pipeline/build/1.21.4/stubs.log pipeline/build/1.21.4/strip.log; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            code=$(curl -sS --max-time 900 -o /tmp/up.json -w '%{http_code}' -X POST -H "filename: $b" --data-binary @"$f" "https://filebin.net/$BIN/$b" 2>/dev/null)
            echo "upload $b -> HTTP $code"
          done
