name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and patch source
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/src.zip "https://aka.doubaocdn.com/s/38PGmxMuSu"
          curl -fL --retry 3 -o /tmp/patch.py "https://filebin.net/mobilite-v14/patch.py?ts=$(date +%s)"
          rm -rf /tmp/src /tmp/work && mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          cp -R /tmp/src/MobiLite /tmp/work
          cd /tmp/work
          python3 /tmp/patch.py
          echo "files=$(find . -type f | wc -l | tr -d ' ')"
      - name: Install xcodegen
        run: |
          set -e
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          rm -rf /tmp/xg && mkdir -p /tmp/xg
          unzip -q /tmp/xg.zip -d /tmp/xg
          echo /tmp/xg/xcodegen/bin >> $GITHUB_PATH
          /tmp/xg/xcodegen/bin/xcodegen --version
      - name: Build launcher
        run: |
          set -o pipefail
          cd /tmp/work
          xcodegen generate
          set +e
          xcodebuild -project MobiLite.xcodeproj -scheme MobiLite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DD CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > /tmp/shell.log 2>&1
          rc=$?
          set -e
          APP="DD/Build/Products/Release-iphoneos/MobiLite.app"
          if [ $rc -ne 0 ] || [ ! -f "$APP/MobiLite" ]; then
            echo "::error::launcher build failed rc=$rc"
            tail -n 30 /tmp/shell.log | while IFS= read -r l; do echo "::error::$l"; done
            curl -sS --max-time 300 -X POST -H "filename: log-shell.txt" --data-binary @/tmp/shell.log "https://filebin.net/mobilite-v14/log-shell.txt" > /dev/null || true
            exit 1
          fi
          echo "app_size=$(du -sh "$APP" | cut -f1)"
          ls -la "$APP"
      - name: Package launcher IPA
        run: |
          set -e
          cd /tmp/work
          APP="DD/Build/Products/Release-iphoneos/MobiLite.app"
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R "$APP" pkg/Payload/
          ( cd pkg && zip -qry /tmp/MobiLite-v14-unsigned.ipa Payload )
          ls -l /tmp/MobiLite-v14-unsigned.ipa
          curl -sS --max-time 300 -X POST -H "filename: MobiLite-v14-unsigned.ipa" --data-binary @/tmp/MobiLite-v14-unsigned.ipa "https://filebin.net/mobilite-v14/MobiLite-v14-unsigned.ipa" > /dev/null
          {
            echo "shell_ipa=MobiLite-v14-unsigned.ipa size=$(stat -f%z /tmp/MobiLite-v14-unsigned.ipa) sha256=$(shasum -a 256 /tmp/MobiLite-v14-unsigned.ipa | awk '{print $1}')"
            echo "shell_main=$(stat -f%z "$APP/MobiLite")"
            echo "shell_app_bytes=$(du -sk "$APP" | awk '{print $1*1024}')"
            echo "shell_bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "shell_minios=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || echo unknown)"
            echo "assets_car=$(stat -f%z "$APP/Assets.car" 2>/dev/null || echo 0)"
            echo "files=$(find "$APP" -type f | wc -l | tr -d ' ')"
            echo "--- file list ---"
            find "$APP" -type f -exec ls -l {} \\; | awk '{print $5, $9}'
          } > /tmp/manifest.txt
          cat /tmp/manifest.txt
          curl -sS --max-time 300 -X POST -H "filename: manifest.txt" --data-binary @/tmp/manifest.txt "https://filebin.net/mobilite-v14/manifest.txt" > /dev/null
      - name: Build probe
        run: |
          set -o pipefail
          cd /tmp/work/probes/MobiProbe
          chmod +x build.sh
          set +e
          SKIP_AOT=1 bash build.sh > /tmp/probe.log 2>&1
          rc=$?
          set -e
          APP="build/Build/Products/Debug-iphoneos/MobiProbe.app"
          if [ $rc -ne 0 ] || [ ! -f "$APP/MobiProbe" ]; then
            echo "::error::probe build failed rc=$rc"
            tail -n 25 /tmp/probe.log | while IFS= read -r l; do echo "::error::$l"; done
            curl -sS --max-time 300 -X POST -H "filename: log-probe.txt" --data-binary @/tmp/probe.log "https://filebin.net/mobilite-v14/log-probe.txt" > /dev/null || true
            exit 1
          fi
          file "$APP/MobiProbe"
          rm -rf /tmp/pkgp && mkdir -p /tmp/pkgp/Payload && cp -R "$APP" /tmp/pkgp/Payload/
          ( cd /tmp/pkgp && zip -qry /tmp/MobiProbe-v14-unsigned.ipa Payload )
          ls -l /tmp/MobiProbe-v14-unsigned.ipa
          curl -sS --max-time 300 -X POST -H "filename: MobiProbe-v14-unsigned.ipa" --data-binary @/tmp/MobiProbe-v14-unsigned.ipa "https://filebin.net/mobilite-v14/MobiProbe-v14-unsigned.ipa" > /dev/null
      - name: Upload logs
        if: always()
        run: |
          for f in /tmp/shell.log /tmp/probe.log; do
            [ -s "$f" ] && curl -sS --max-time 300 -X POST -H "filename: $(basename $f)" --data-binary "@$f" "https://filebin.net/mobilite-v14/$(basename $f)" > /dev/null || true
          done
          echo done
