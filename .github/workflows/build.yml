name: Build MobiLite IPA v17

on:
  push:
    branches: [ main ]

env:
  MC_VER: "1.21.4"
  AOT_SCOPE: "narrow"
  CLASS_VER: "52"
  BIN: "mobilite-v17"
  SRC_ZIP: "https://filebin.net/mobilite-v17/MobiLite-v17-src.zip"
  SRC_ZIP_ALT: "https://aka.doubaocdn.com/s/JRw8VIs5j5"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash .ci/run.sh
