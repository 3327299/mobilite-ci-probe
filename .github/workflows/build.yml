name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source
        run: |
          set -exo pipefail
          exec > >(tee /tmp/prep.log) 2>&1
          curl -fL --retry 3 -o /tmp/src.zip "https://aka.doubaocdn.com/s/38PGmxMuSu"
          curl -fL --retry 3 -o /tmp/patch.py "https://filebin.net/mobilite-v14/patch.py"
          rm -rf /tmp/src /tmp/work && mkdir -p /tmp/src
          unzip -q /tmp/src.zip -d /tmp/src
          cp -R /tmp/src/MobiLite /tmp/work
          cd /tmp/work
          python3 /tmp/patch.py
          mkdir -p /tmp/tools
          curl -fL --retry 3 -o /tmp/xg.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q /tmp/xg.zip -d /tmp/tools
          /tmp/tools/xcodegen/bin/xcodegen --version
          echo "files=$(find . -type f | wc -l | tr -d ' ')"
      - name: Build launcher
        run: |
          set -exo pipefail
          exec > >(tee /tmp/shell.log) 2>&1
          export PATH=/tmp/tools/xcodegen/bin:$PATH
          cd /tmp/work
          xcodegen generate
          xcodebuild -project MobiLite.xcodeproj -scheme MobiLite -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DD CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="DD/Build/Products/Release-iphoneos/MobiLite.app"
          test -f "$APP/MobiLite"
          rm -rf pkg && mkdir -p pkg/Payload
          cp -R "$APP" pkg/Payload/
          ( cd pkg && zip -qry /tmp/MobiLite-v14-unsigned.ipa Payload )
          ls -l /tmp/MobiLite-v14-unsigned.ipa
      - name: Publish launcher
        if: success()
        run: |
          set -ex
          curl -sS --max-time 300 -X POST -H "filename: MobiLite-v14-unsigned.ipa" --data-binary @/tmp/MobiLite-v14-unsigned.ipa "https://filebin.net/mobilite-v14/MobiLite-v14-unsigned.ipa"
          cd /tmp/work
          APP="DD/Build/Products/Release-iphoneos/MobiLite.app"
          {
            echo "shell_size=$(stat -f%z /tmp/MobiLite-v14-unsigned.ipa)"
            echo "shell_sha256=$(shasum -a 256 /tmp/MobiLite-v14-unsigned.ipa | awk '{print $1}')"
            echo "shell_main=$(stat -f%z "$APP/MobiLite")"
            echo "shell_app_bytes=$(du -sk "$APP" | awk '{print $1*1024}')"
            echo "shell_bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "shell_minios=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" 2>/dev/null || echo unknown)"
            echo "assets_car=$(stat -f%z "$APP/Assets.car" 2>/dev/null || echo 0)"
            echo "files=$(find "$APP" -type f | wc -l | tr -d ' ')"
            echo "--- file list ---"
            find "$APP" -type f -exec ls -l {} \\; | awk '{print $5, $9}'
          } > /tmp/manifest.txt
          cat /tmp/manifest.txt
          curl -sS --max-time 300 -X POST -H "filename: manifest.txt" --data-binary @/tmp/manifest.txt "https://filebin.net/mobilite-v14/manifest.txt"
      - name: Build probe
        run: |
          set -exo pipefail
          exec > >(tee /tmp/probe.log) 2>&1
          export PATH=/tmp/tools/xcodegen/bin:$PATH
          cd /tmp/work/probes/MobiProbe
          chmod +x build.sh
          SKIP_AOT=1 bash build.sh
          APP="build/Build/Products/Debug-iphoneos/MobiProbe.app"
          test -f "$APP/MobiProbe"
          rm -rf /tmp/pkgp && mkdir -p /tmp/pkgp/Payload
          cp -R "$APP" /tmp/pkgp/Payload/
          ( cd /tmp/pkgp && zip -qry /tmp/MobiProbe-v14-unsigned.ipa Payload )
          ls -l /tmp/MobiProbe-v14-unsigned.ipa
          curl -sS --max-time 300 -X POST -H "filename: MobiProbe-v14-unsigned.ipa" --data-binary @/tmp/MobiProbe-v14-unsigned.ipa "https://filebin.net/mobilite-v14/MobiProbe-v14-unsigned.ipa"
      - name: Dump logs on failure
        if: failure()
        run: |
          set +e
          for f in /tmp/prep.log /tmp/shell.log /tmp/probe.log; do
            [ -s "$f" ] || continue
            echo "===== $f (tail 40) ====="
            tail -n 40 "$f" | while IFS= read -r l; do echo "::error::$l"; done
            curl -sS --max-time 300 -X POST -H "filename: $(basename $f)" --data-binary "@$f" "https://filebin.net/mobilite-v14/$(basename $f)"
          done
