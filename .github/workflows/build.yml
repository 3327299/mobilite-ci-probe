name: Build MobiLite IPA v18

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
      - '_ci_logs/**'
      - '*.md'

permissions:
  contents: write

env:
  MC_VER: "1.21.4"
  AOT_SCOPE: "narrow"
  CLASS_VER: "52"
  BIN: "mobilite-v18"
  SRC_ZIP: "https://aka.doubaocdn.com/s/oVMkvRdfUQ"
  SRC_ZIP_ALT: "https://aka.doubaocdn.com/s/oVMkvRdfUQ"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 固定 Xcode / 工具链路径
        run: |
          echo "xcode-select: $(xcode-select -p)"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          ls "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs" | head -5

      - name: Build
        run: bash .ci/run.sh || bash .ci/fallback.sh
